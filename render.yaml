services:
  - type: web
    name: ticketmaster-backend
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    plan: free
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./ticketMasterDb.sqlite3

  - type: web
    name: ticketmaster-frontend
    runtime: static
    buildCommand: cd Frontend && npm install && npm run build
    staticPublishPath: Frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA fallback: React Router handles routes like /events/5 client-side,
      # but the static host has no such file — rewrite every path to
      # index.html so the app's own router can take over instead of 404ing.
      - type: rewrite
        source: /*
        destination: /index.html
